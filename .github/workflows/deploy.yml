name: Deploy

on:
  push:
    branches: [main]
  # Todo dia às 06:00 UTC (03:00 em Brasília): atualiza o gráfico de atividade.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Lê a atividade pública do GitHub (scripts/fetch-github-activity.mjs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O GitHub Pages só redireciona para o domínio oficial.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/github-pages

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/client

      # Wrangler via npx: o projeto não precisa dele como dependência.
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
